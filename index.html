<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker + Jenkins Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-top: 0; color: #4facfe; }
        .badge {
            display: inline-block;
            background: #28a745;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CI/CD Pipeline Thành Công!</h1>
        <p>Trang web này được đóng gói tự động bằng <strong>Docker</strong> và triển khai thông qua <strong>Jenkins</strong>.</p>
        <p>Trạng thái hệ thống: <span class="badge">● Đang hoạt động (Running)</span></p>
    </div>
</body>
</html>
